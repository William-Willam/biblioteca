<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Diagrama de atores do sistema de biblioteca</title>
<desc>Bibliotecário/Admin interage com o sistema, que possui quatro módulos: Pessoas, Livros, Empréstimos e Reservas, protegidos por autenticação JWT.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="340" fill="#ffffff"/>

<rect x="40" y="130" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="105" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#712B13">Bibliotecário</text>
<text x="105" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">Ator único</text>

<line x1="170" y1="158" x2="200" y2="158" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="200" y="40" width="440" height="260" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="222" y="66" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">Sistema de biblioteca</text>

<rect x="222" y="90" width="190" height="56" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="317" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Pessoas</text>
<text x="317" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">Cadastro e inativação</text>

<rect x="422" y="90" width="196" height="56" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="520" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Livros</text>
<text x="520" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">Acervo e exemplares</text>

<rect x="222" y="164" width="190" height="56" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="317" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#633806">Empréstimos</text>
<text x="317" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#854F0B">Devolução e multa</text>

<rect x="422" y="164" width="196" height="56" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="520" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#633806">Reservas</text>
<text x="520" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#854F0B">Fila e prazo de retirada</text>

<rect x="222" y="238" width="396" height="42" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="420" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Autenticação (JWT)</text>
</svg>
